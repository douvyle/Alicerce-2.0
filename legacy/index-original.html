<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alicerce — Organizador Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#FAF8F5;
    --surface:#FFFFFF;
    --surface-2:#F2EEE8;
    --ink:#3C4A42;
    --ink-80:rgba(60,74,66,.80);
    --ink-60:rgba(60,74,66,.58);
    --ink-40:rgba(60,74,66,.40);
    --ink-20:rgba(60,74,66,.14);
    --pillar:#5C8770;
    --pillar-light:#8FBBA0;
    --income:#74BFA0;
    --clay:#D9906F;
    --blueprint:#83A6CC;
    --mustard:#CCA35C;
    --slate:#ACAFD1;
    --plum:#B686A3;
    --sand:#C9C0B2;
    --danger:#CE7B6C;
    --line:rgba(60,74,66,.10);
    --shadow-s:0 1px 2px rgba(60,74,66,.05);
    --shadow-m:0 1px 2px rgba(60,74,66,.04), 0 10px 28px rgba(60,74,66,.06);
    --sidebar-bg:linear-gradient(180deg,#6E8A79,#5D7A69 65%,#54705F);
    --topbar-bg:rgba(250,248,245,.86);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  /* ---------- Theme: Noturno (dark) ---------- */
  html[data-theme="noturno"]{
    --paper:#20241F;
    --surface:#282D26;
    --surface-2:#333930;
    --ink:#E9E6DF;
    --ink-80:rgba(233,230,223,.82);
    --ink-60:rgba(233,230,223,.60);
    --ink-40:rgba(233,230,223,.42);
    --ink-20:rgba(233,230,223,.16);
    --pillar:#75AE90;
    --pillar-light:#9BCBB0;
    --income:#84CBAA;
    --clay:#E29A76;
    --blueprint:#93B7DE;
    --mustard:#D8AF6E;
    --slate:#ADB2DA;
    --plum:#C494B2;
    --sand:#BDB4A6;
    --danger:#E28576;
    --line:rgba(233,230,223,.12);
    --shadow-s:0 1px 2px rgba(0,0,0,.20);
    --shadow-m:0 1px 2px rgba(0,0,0,.20), 0 10px 28px rgba(0,0,0,.28);
    --sidebar-bg:linear-gradient(180deg,#171B15,#12160F 65%,#0F120C);
    --topbar-bg:rgba(32,36,31,.86);
  }

  /* ---------- Theme: Clássico (original deep palette) ---------- */
  html[data-theme="classico"]{
    --paper:#F4F6F4;
    --surface:#FFFFFF;
    --surface-2:#EBEFEC;
    --ink:#16201C;
    --ink-80:rgba(22,32,28,.82);
    --ink-60:rgba(22,32,28,.60);
    --ink-40:rgba(22,32,28,.40);
    --ink-20:rgba(22,32,28,.14);
    --pillar:#2E4A3D;
    --pillar-light:#5C8A73;
    --income:#3E7C5E;
    --clay:#C2573C;
    --blueprint:#4C6FA0;
    --mustard:#B8863B;
    --slate:#8A93A6;
    --plum:#8C5B72;
    --sand:#A9AFB8;
    --danger:#B3402B;
    --line:rgba(22,32,28,.11);
    --shadow-s:0 1px 2px rgba(22,32,28,.05);
    --shadow-m:0 1px 2px rgba(22,32,28,.04), 0 10px 28px rgba(22,32,28,.07);
    --sidebar-bg:linear-gradient(180deg,#16201C,#1E2B24 65%,#1B2721);
    --topbar-bg:rgba(244,246,244,.86);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select{font-family:var(--font-body);}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blueprint); outline-offset:2px; border-radius:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .animate-in{ animation:riseIn .55s cubic-bezier(.2,.7,.2,1) both; }

  /* ---------- Layout ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:264px; flex:0 0 264px;
    background:var(--sidebar-bg);
    color:rgba(255,255,255,.92);
    position:relative;
    padding:28px 22px 22px 30px;
    display:flex; flex-direction:column;
    transition:background .25s ease;
  }
  .sidebar::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:8px;
    background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.38) 0 1px, transparent 1px 14px);
  }
  .brand{ margin-bottom:6px; }
  .brand-mark{
    font-family:var(--font-display); font-weight:700; font-size:22px;
    letter-spacing:.04em; color:#FFFFFF;
  }
  .brand-tag{
    font-size:11.5px; color:rgba(255,255,255,.55); font-style:italic; margin-top:3px;
  }
  .brand-credit{
    font-size:9.5px; color:rgba(255,255,255,.35); margin-top:6px; letter-spacing:.03em;
  }
  .sidebar-nav{ margin-top:34px; display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:10px;
    color:rgba(255,255,255,.75); font-size:13.5px; font-weight:500;
    border:none; background:transparent; text-align:left; width:100%;
    border-left:3px solid transparent;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{ flex:0 0 auto; opacity:.85; }
  .nav-item:hover{ background:rgba(255,255,255,.10); color:#FFFFFF; }
  .nav-item.active{
    background:rgba(255,255,255,.14); color:#FFFFFF;
    border-left:3px solid var(--clay);
  }
  .sidebar-spacer{ flex:1; }
  .sidebar-summary{
    border-top:1px solid rgba(255,255,255,.18); padding-top:16px; margin-top:18px;
  }
  .sidebar-summary .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.55); }
  .sidebar-summary .value{ font-family:var(--font-mono); font-size:19px; margin-top:4px; color:#FFFFFF; }
  .reset-link{
    margin-top:16px; background:none; border:none; color:rgba(255,255,255,.5);
    font-size:11.5px; text-decoration:underline; text-underline-offset:2px; padding:0;
  }
  .reset-link:hover{ color:rgba(255,255,255,.85); }
  .theme-switcher{ display:flex; gap:8px; margin-top:14px; }
  .theme-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.3); padding:0;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .theme-dot:hover{ transform:scale(1.1); }
  .theme-dot.active{ border-color:#FFFFFF; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 36px; background:var(--topbar-bg); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topbar h1{ font-size:23px; font-weight:700; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-60); margin-top:2px; }
  .btn{
    font-size:13px; font-weight:600; border-radius:10px; padding:10px 16px;
    border:1px solid transparent; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--clay); color:#fff; box-shadow:var(--shadow-s); }
  .btn-primary:hover{ background:#AD4A32; }
  .btn-ghost{ background:transparent; color:var(--ink-70); border-color:var(--ink-20); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-sm{ padding:7px 11px; font-size:12px; border-radius:8px; }

  .view-root{ padding:30px 36px 60px; }

  /* ---------- Cards / grids ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow-m); padding:22px;
  }
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px; }
  .kpi-card{ padding:18px 20px; }
  .kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-40); }
  .kpi-value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px; }
  .kpi-delta{ font-size:12px; margin-top:6px; color:var(--ink-60); }
  .kpi-delta.up{ color:var(--pillar); }
  .kpi-delta.down{ color:var(--danger); }

  .grid-2{ display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start; }
  .dash-columns{ display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start; }
  .dash-col{ display:flex; flex-direction:column; gap:14px; min-width:0; }
  .section-title{ font-size:16px; font-weight:600; margin-bottom:4px; }
  .section-sub{ font-size:12px; color:var(--ink-40); margin-bottom:16px; }

  /* ---------- Foundation signature visual ---------- */
  .foundation-card{ display:flex; gap:20px; align-items:center; }
  .foundation-visual{ flex:0 0 150px; }
  .foundation-meta{ flex:1; }
  .foundation-pct{ font-family:var(--font-display); font-size:38px; font-weight:700; color:var(--pillar); }
  .foundation-label{ font-size:13px; color:var(--ink-60); margin-top:2px; }
  .foundation-note{ font-size:12px; color:var(--ink-40); margin-top:10px; }
  .fnd-tick-label{ font-family:var(--font-mono); font-size:8px; fill:var(--ink-40); }

  /* ---------- Category legend / lists ---------- */
  .legend-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .legend-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .dot{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
  .legend-row .amt{ margin-left:auto; color:var(--ink-70); }

  .pillar-list{ display:flex; flex-direction:column; gap:14px; }
  .pillar-row .top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .pillar-row .cat{ font-weight:600; }
  .pillar-row .figs{ color:var(--ink-50); }
  .bar-track{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; position:relative; }
  .bar-fill{
    height:100%; border-radius:5px;
    background-image:repeating-linear-gradient(to right, rgba(255,255,255,.28) 0 6px, transparent 6px 12px);
    transition:width .5s ease;
  }
  .pillar-row.over .bar-fill{ background-color:var(--danger); }
  .pillar-row .over-tag{ color:var(--danger); font-weight:600; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-40); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{ padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .type-tag{ font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600; }
  .type-tag.receita{ background:rgba(92,135,112,.14); color:var(--pillar); }
  .type-tag.despesa{ background:rgba(206,123,108,.13); color:var(--danger); }
  .amt-receita{ color:var(--pillar); font-weight:600; }
  .amt-despesa{ color:var(--ink-80); }
  .row-del{ background:none; border:none; color:var(--ink-40); padding:4px; border-radius:6px; }
  .row-del:hover{ color:var(--danger); background:rgba(206,123,108,.10); }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:9px 12px; border-radius:9px; border:1px solid var(--ink-20); background:var(--surface);
    font-size:13px; color:var(--ink);
  }
  .toolbar input{ flex:1; min-width:160px; }

  /* ---------- Budget pillars view ---------- */
  .pillars-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .pillar-card{ display:flex; flex-direction:column; gap:10px; }
  .pillar-card .head{ display:flex; justify-content:space-between; align-items:baseline; }
  .pillar-card .head .cat{ font-weight:600; font-size:14px; }
  .pillar-card .pct{ font-family:var(--font-mono); font-size:12px; color:var(--ink-50); }
  .pillar-card.over .pct{ color:var(--danger); font-weight:600; }
  .pillar-card .figs{ font-size:12px; color:var(--ink-50); display:flex; justify-content:space-between; }
  .budget-input{ width:74px; text-align:right; padding:5px 7px; border-radius:6px; border:1px solid var(--ink-20); font-family:var(--font-mono); font-size:12px; }

  .rule-box{ display:flex; gap:22px; margin-top:22px; }
  .rule-item{ flex:1; }
  .rule-item .label{ font-size:11.5px; color:var(--ink-50); margin-bottom:6px; display:flex; justify-content:space-between; }
  .rule-track{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }

  /* ---------- Goals ---------- */
  .goals-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
  .goal-card{ display:flex; flex-direction:column; gap:12px; }
  .goal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .goal-card .name{ font-weight:600; font-size:14.5px; }
  .goal-card .deadline{ font-size:11.5px; color:var(--ink-40); }
  .goal-card .figs{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-60); margin-top:2px;}
  .goal-card.done .name::after{ content:' ✓ concluída'; color:var(--pillar); font-size:11px; font-weight:600; }

  /* ---------- Empty / loading ---------- */
  .loading-wrap{ display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:14px; color:var(--ink-40); font-size:13px; }
  .spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--ink-20); border-top-color:var(--pillar); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,32,28,.42); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-l); padding:26px; width:100%; max-width:420px;
    box-shadow:0 20px 60px rgba(22,32,28,.25);
  }
  .modal h3{ font-size:18px; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-50); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
  .field input, .field select{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--ink-20); font-size:13.5px; background:var(--paper);
  }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1; padding:9px; border-radius:9px; border:1px solid var(--ink-20); background:var(--paper);
    font-size:13px; font-weight:600; color:var(--ink-60);
  }
  .type-toggle button.active.receita{ background:rgba(92,135,112,.14); border-color:var(--pillar); color:var(--pillar); }
  .type-toggle button.active.despesa{ background:rgba(206,123,108,.13); border-color:var(--danger); color:var(--danger); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .pdf-preview{
    border:1px solid var(--line); border-radius:10px; overflow:hidden; height:52vh; background:#EDEDED;
  }
  .pdf-preview iframe{ width:100%; height:100%; border:none; display:block; }
  #pdfDownloadLink{ text-decoration:none; }
  .color-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .color-swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .color-swatch:hover{ transform:scale(1.12); }
  .color-swatch.active{ border-color:var(--ink); }
  #evColorCustom{ width:26px; height:26px; padding:0; border:1px solid var(--ink-20); border-radius:6px; cursor:pointer; background:none; }

  .charts-row{ display:grid; grid-template-columns:1.3fr .7fr; gap:18px; }
  canvas{ max-width:100%; }
  .chart-box{ position:relative; height:230px; margin-bottom:6px; }
  .chart-box canvas{ width:100% !important; height:100% !important; }
  .chart-box.tall{ height:270px; }

  /* ---------- Generic active state for evento/tarefa toggle ---------- */
  .type-toggle button.active{ background:var(--surface-2); border-color:var(--pillar); color:var(--pillar); }

  /* ---------- Calendar toolbar ---------- */
  .cal-toolbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  .cal-export{ display:flex; gap:8px; }
  .seg-toggle{ display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; }
  .seg-toggle button{ border:none; background:transparent; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-60); }
  .seg-toggle button.active{ background:var(--surface); color:var(--pillar); box-shadow:var(--shadow-s); }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav-label{ font-family:var(--font-display); font-weight:600; font-size:14.5px; min-width:150px; text-align:center; }

  /* ---------- Month grid ---------- */
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px; }
  .cal-weekdays div{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-40); text-align:center; font-weight:600; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-cell{
    min-height:104px; border:1px solid var(--line); border-radius:10px; padding:8px;
    background:var(--surface); display:flex; flex-direction:column; gap:6px; cursor:pointer;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .cal-cell:hover{ box-shadow:var(--shadow-s); border-color:var(--ink-20); }
  .cal-cell.out{ background:var(--surface-2); opacity:.55; }
  .cal-cell.today{ border-color:var(--clay); border-width:1.5px; }
  .cal-cell-head{ display:flex; align-items:center; justify-content:space-between; }
  .cal-daynum{ font-family:var(--font-mono); font-size:12px; color:var(--ink-60); }
  .cal-cell.today .cal-daynum{ color:var(--clay); font-weight:700; }
  .cal-add{
    width:18px; height:18px; border-radius:5px; border:none; background:transparent; color:var(--ink-40);
    font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; opacity:0;
    transition:opacity .12s ease, background .12s ease;
  }
  .cal-cell:hover .cal-add{ opacity:1; }
  .cal-add:hover{ background:var(--surface-2); color:var(--pillar); }
  .cal-cell-items{ display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .cal-chip{
    display:flex; align-items:center; gap:5px; font-size:10.5px; padding:3px 5px; border-radius:5px;
    background:var(--surface-2); white-space:nowrap; overflow:hidden; cursor:pointer;
  }
  .cal-chip .chip-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .cal-chip .chip-amt{ font-size:9.5px; color:var(--ink-50); }
  .cal-chip .chip-time{ color:var(--ink-40); }
  .cal-chip.task.done .chip-label{ text-decoration:line-through; color:var(--ink-40); }
  .cal-chip .dot{ width:6px; height:6px; border-radius:2px; flex:0 0 auto; }
  .cal-chip.event{
    font-weight:600; padding:4px 7px; box-shadow:0 1px 2px rgba(0,0,0,.10);
  }
  .cal-chip.event:hover{ filter:brightness(1.06); }
  .cal-more{ font-size:9.5px; color:var(--ink-40); padding:1px 5px; }

  /* ---------- Task checkbox ---------- */
  .task-check{
    width:12px; height:12px; border-radius:4px; border:1.5px solid var(--ink-20); flex:0 0 auto; cursor:pointer;
    display:inline-block; position:relative;
  }
  .task-check.done{ background:var(--pillar); border-color:var(--pillar); }

<script>
/* ================= ICONS ================= */
function icon(name){

}

/* ================= DATA ================= */
const EXPENSE_CATEGORIES = ['Moradia','Alimentação','Transporte','Estudos','Lazer','Saúde','Poupança','Outros'];
const INCOME_CATEGORIES = ['Bolsa/Salário','Freelance','Outros'];
const THEME_PALETTES = {
  pastel:   { pillar:'#5C8770', pillarLight:'#8FBBA0', income:'#74BFA0', clay:'#D9906F', blueprint:'#83A6CC', mustard:'#CCA35C', slate:'#ACAFD1', plum:'#B686A3', sand:'#C9C0B2', danger:'#CE7B6C' },
  noturno:  { pillar:'#75AE90', pillarLight:'#9BCBB0', income:'#84CBAA', clay:'#E29A76', blueprint:'#93B7DE', mustard:'#D8AF6E', slate:'#ADB2DA', plum:'#C494B2', sand:'#BDB4A6', danger:'#E28576' },
  classico: { pillar:'#2E4A3D', pillarLight:'#5C8A73', income:'#3E7C5E', clay:'#C2573C', blueprint:'#4C6FA0', mustard:'#B8863B', slate:'#8A93A6', plum:'#8C5B72', sand:'#A9AFB8', danger:'#B3402B' }
};
function paletteToCategoryHex(p){
  return {
    'Moradia':p.pillar,'Alimentação':p.blueprint,'Transporte':p.clay,'Estudos':p.mustard,
    'Lazer':p.slate,'Saúde':p.plum,'Poupança':p.pillarLight,'Outros':p.sand,
    'Bolsa/Salário':p.income,'Freelance':p.plum
  };
}
function paletteToAgendaColors(p){
  return { 'Trabalho':p.blueprint,'Pessoal':p.plum,'Estudo':p.mustard,'Saúde':p.danger,'Financeiro':p.pillar,'Outro':p.sand };
}
let currentTheme = 'pastel';
let CATEGORY_HEX = paletteToCategoryHex(THEME_PALETTES.pastel);
let AGENDA_COLORS = paletteToAgendaColors(THEME_PALETTES.pastel);
const AGENDA_CATEGORIES = ['Trabalho','Pessoal','Estudo','Saúde','Financeiro','Outro'];
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_LABEL = 'Julho de 2026';
const STORAGE_KEY = 'alicerce-financas-state-v1';

function uid(){ return 't' + Math.random().toString(36).slice(2,9); }

function seedState(){
  return {
    budgets:{ 'Moradia':650,'Alimentação':400,'Transporte':250,'Estudos':150,'Lazer':100,'Saúde':80,'Poupança':200,'Outros':60 },
    goals:[

      {id:'g2', name:'Notebook novo', target:3500, saved:900, deadline:'2027-03-01'},
      {id:'g3', name:'Curso de especialização', target:1200, saved:1200, deadline:'2026-06-01'}
    ],
    transactions:[
      {id:uid(), date:'2026-07-05', description:'Bolsa-auxílio de estágio', category:'Bolsa/Salário', type:'receita', amount:1800},
      {id:uid(), date:'2026-07-05', description:'Aluguel — kitnet', category:'Moradia', type:'despesa', amount:650},
      {id:uid(), date:'2026-07-06', description:'Transferência para reserva de emergência', category:'Poupança', type:'despesa', amount:200},
      {id:uid(), date:'2026-07-08', description:'Compras do mês — mercado', category:'Alimentação', type:'despesa', amount:280},
      {id:uid(), date:'2026-07-10', description:'Combustível / passagens', category:'Transporte', type:'despesa', amount:180},
      {id:uid(), date:'2026-07-12', description:'Apostila curso de AutoCAD', category:'Estudos', type:'despesa', amount:90},
      {id:uid(), date:'2026-07-14', description:'Farmácia', category:'Saúde', type:'despesa', amount:55},

      {id:uid(), title:'Contatos importantes', content:'Engenheiro responsável: (63) 9xxxx-xxxx\nMestre de obras: (63) 9xxxx-xxxx\nFornecedor de concreto: (63) 9xxxx-xxxx', attachments:[], updatedAt:'2026-07-20T10:00:00.000Z'}
    ]
  };
}

let state = null;
let currentView = 'dashboard';
let charts = {};
let calMode = 'mensal';
let calRefDate = '2026-07-28';
let currentNoteId = null;
let selectedNoteIds = new Set();
let aiChatHistory = [];

/* ================= STORAGE ================= */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      const seed = seedState();
      parsed.events = parsed.events || seed.events;
      parsed.notes = parsed.notes || seed.notes;
      parsed.history = parsed.history || seed.history;
      parsed.budgets = parsed.budgets || seed.budgets;
      parsed.theme = parsed.theme || 'pastel';
      return parsed;
    }
    return seedState();
  }catch(err){
    return seedState();
  }
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(err){
    console.error('Não foi possível salvar os dados:', err);
  }
}

/* ================= HELPERS ================= */
function brl(n){
  const v = Number(n)||0;
  return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function shortDate(iso){
  const [y,m,d] = iso.split('-');
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${d} ${meses[parseInt(m,10)-1]}`;
}
function monthTx(){ return state.transactions.filter(t=>t.date.startsWith('2026-07')); }
function totalReceita(){ return monthTx().filter(t=>t.type==='receita').reduce((s,t)=>s+t.amount,0); }
function totalDespesa(){ return monthTx().filter(t=>t.type==='despesa').reduce((s,t)=>s+t.amount,0); }
function spentByCategory(cat){ return monthTx().filter(t=>t.category===cat && t.type==='despesa').reduce((s,t)=>s+t.amount,0); }
function mainGoal(){ return state.goals.find(g=>g.id==='g1') || state.goals[0]; }

/* ---------- Calendar date helpers ---------- */
const TODAY_ISO = '2026-07-28';
function parseDate(iso){ return new Date(iso+'T00:00:00'); }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function startOfWeek(d){ const nd=new Date(d); nd.setDate(nd.getDate()-nd.getDay()); return nd; }
function txByDate(iso){ return state.transactions.filter(t=>t.date===iso); }

function eventOccursOnDate(ev, iso){
  const d = parseDate(iso), start = parseDate(ev.date);
  if(d < start) return false;
  if(ev.recurrence==='diaria') return true;
  if(ev.recurrence==='semanal') return d.getDay()===start.getDay();
  if(ev.recurrence==='mensal'){
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return d.getDate()===Math.min(start.getDate(), lastDay);
  }
  if(ev.recurrence==='anual') return d.getDate()===start.getDate() && d.getMonth()===start.getMonth();
  return iso===ev.date;
}
function agendaOnDate(iso){
  return (state.events||[]).filter(ev=>eventOccursOnDate(ev, iso));
}
function isTaskDoneOn(ev, iso){
  return ev.recurrence==='nenhuma' ? !!ev.done : (ev.doneDates||[]).includes(iso);
}
function toggleTaskDone(evId, iso){
  const ev = state.events.find(e=>e.id===evId);
  if(!ev) return;
  if(ev.recurrence==='nenhuma'){ ev.done = !ev.done; }
  else{
    ev.doneDates = ev.doneDates||[];
    const idx = ev.doneDates.indexOf(iso);
    if(idx>=0) ev.doneDates.splice(idx,1); else ev.doneDates.push(iso);
  }
  saveState(); renderAll();
}
function dayEntries(iso){
  const agenda = agendaOnDate(iso).map(ev=>({
    kind:ev.type, id:ev.id, label:ev.title, color:ev.color || AGENDA_COLORS[ev.category] || '#ACAFD1',
    done:isTaskDoneOn(ev,iso), time:ev.time, recurrence:ev.recurrence
  })).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const tx = txByDate(iso).map(t=>({
    kind:'transacao', id:t.id, label:t.description, color:CATEGORY_HEX[t.category], amount:t.amount, txType:t.type
  }));
  return [...agenda, ...tx];
}

/* ---------- Generalized month-range helpers (for export/report, any month) ---------- */
function txInMonth(year, month){
  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
  return state.transactions.filter(t=>t.date.startsWith(prefix));
}
function spentByCategoryInMonth(cat, year, month){
  return txInMonth(year,month).filter(t=>t.category===cat && t.type==='despesa').reduce((s,t)=>s+t.amount,0);
}
function agendaInMonth(year, month){
  const daysInM = new Date(year, month+1, 0).getDate();
  const items = [];
  for(let day=1; day<=daysInM; day++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    agendaOnDate(iso).forEach(ev=> items.push({ title:ev.title, dateLabel:`${String(day).padStart(2,'0')}/${String(month+1).padStart(2,'0')}`, type:ev.type }));
  }
  return items;
}

/* ---------- Robust PDF output: open in new tab instead of forcing a download ---------- */
/* Forced downloads can be blocked by the sandboxed preview this site may run inside;
   opening the PDF in a new tab is a plain navigation, which is far less likely to be blocked,
   and the browser's own PDF viewer lets the person save it from there. */
function openPDF(doc, filename){
  let dataUri;
  try{
    dataUri = doc.output('datauristring');
  }catch(e){
    showToast('Não foi possível gerar o PDF neste ambiente.', 'error');
    return;
  }
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" style="max-width:680px; width:92vw;">
        <h3>Seu PDF está pronto</h3>
        <p style="font-size:12.5px; color:var(--ink-60); line-height:1.5; margin:0 0 12px;">
          Clique em "Baixar PDF" abaixo. Se o download não iniciar (alguns navegadores bloqueiam downloads automáticos aqui), clique com o botão direito no mesmo link e escolha <strong>"Salvar link como…"</strong>.
        </p>
        <div class="pdf-preview">
          <iframe src="${dataUri}" title="Pré-visualização do PDF"></iframe>
        </div>
        <div class="modal-actions" style="justify-content:space-between;">
          <button class="btn btn-ghost" id="closePdfModal" type="button">Fechar</button>
          <a href="${dataUri}" download="${filename}" class="btn btn-primary" id="pdfDownloadLink">${icon('plus')} Baixar PDF</a>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backdrop').addEventListener('click', (e)=>{ if(e.target.id==='backdrop') closeModal(); });
  document.getElementById('closePdfModal').addEventListener('click', closeModal);
}

/* ---------- Detailed calendar export (PDF, landscape, day-by-day with times) ---------- */
function generateCalendarPDF(mode){
  if(typeof window.jspdf === 'undefined'){ showToast('Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.', 'error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'landscape' });
  const pageW = 297, pageH = 210, marginX = 16, marginTop = 18, marginBottom = 14;
  let y = marginTop;
  const ref = parseDate(calRefDate);
  const dayNamesFull = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  let days = [], titleLabel = '';
  if(mode==='diario'){
    days = [new Date(ref)];
    titleLabel = ref.toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'});
  } else if(mode==='semanal'){
    const start = startOfWeek(ref);
    days = [...Array(7)].map((_,i)=>addDays(start,i));
    const end = addDays(start,6);
    titleLabel = `Semana de ${start.getDate()} a ${end.getDate()} de ${end.toLocaleDateString('pt-BR',{month:'long', year:'numeric'})}`;
  } else {
    const y0 = ref.getFullYear(), m0 = ref.getMonth();
    const n = new Date(y0, m0+1, 0).getDate();
    days = [...Array(n)].map((_,i)=> new Date(y0, m0, i+1));
    titleLabel = ref.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  }

  function drawRunningHeader(){
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(150,150,150);
    doc.text('Alicerce — '+titleLabel, marginX, y);
    y += 8;
  }
  function ensureSpace(rowsNeeded){
    if(y + rowsNeeded*5.3 > pageH - marginBottom){ doc.addPage(); y = marginTop; drawRunningHeader(); }
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,40,36);
  doc.text('Alicerce', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,100,95);
  doc.text('Agenda e financeiro — '+titleLabel, marginX, y+7);
  y += 20;

  days.forEach(d=>{
    const iso = toISO(d);
    const entries = dayEntries(iso);
    const agendaItems = entries.filter(e=>e.kind!=='transacao');
    const txItems = entries.filter(e=>e.kind==='transacao');
    ensureSpace(3);
    doc.setDrawColor(222); doc.line(marginX, y, pageW-marginX, y); y += 6.5;
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(40,48,44);
    let dayLabel = `${dayNamesFull[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    doc.text(dayLabel, marginX, y);
    if(iso===TODAY_ISO){
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(207,118,88);
      doc.text('(hoje)', marginX + doc.getTextWidth(dayLabel) + 22, y);
    }
    y += 6.5;
    if(!entries.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(150,150,150);
      doc.text('Nada registrado neste dia.', marginX+3, y);
      y += 6;
    } else {
      doc.setFontSize(9);
      agendaItems.forEach(it=>{
        ensureSpace(1);
        doc.setFont('helvetica','bold'); doc.setTextColor(110,118,113);
        doc.text(it.time || '—', marginX+3, y);
        doc.setFont('helvetica','normal'); doc.setTextColor(40,48,44);
        doc.text(`[${it.kind==='tarefa' ? (it.done?'Tarefa concluída':'Tarefa') : 'Evento'}] ${it.label}`, marginX+22, y);
        y += 5.3;
      });
      txItems.forEach(it=>{
        ensureSpace(1);
        if(it.txType==='receita'){ doc.setTextColor(70,120,95); } else { doc.setTextColor(180,95,80); }
        doc.setFont('helvetica','normal');
        doc.text(`${it.txType==='receita'?'+':'-'} ${brl(it.amount)}`, marginX+3, y);
        doc.setTextColor(100,106,102);
        doc.text(it.label, marginX+34, y);
        y += 5.3;
      });
    }
    y += 3.5;
  });

  doc.setFontSize(7.5); doc.setTextColor(160,160,160); doc.setFont('helvetica','normal');
  doc.text('Gerado por Alicerce — um site do doves — em '+new Date().toLocaleDateString('pt-BR'), marginX, pageH-8);

  const modeLabel = mode==='diario'?'dia':mode==='semanal'?'semana':'mes';
  openPDF(doc, `alicerce-agenda-${modeLabel}-${toISO(ref)}.pdf`);
}

/* ================= FOUNDATION SIGNATURE VISUAL ================= */
function buildFoundationSVG(percent){
  const p = Math.max(0, Math.min(100, percent));
  const top=20, left=20, w=110, h=160;
  const fillH = h * (p/100);
  const fillY = top + (h - fillH);
  const ticks = [0,25,50,75,100].map(t=>{
    const y = top + h * (1 - t/100);
    return `<line x1="10" y1="${y}" x2="16" y2="${y}" style="stroke:var(--ink-40)" stroke-width="1"/>
            <text x="2" y="${y+3}" class="fnd-tick-label">${t}</text>`;
  }).join('');
  let courses = '';
  const courseGap = 18;
  for(let y = top + h; y > fillY; y -= courseGap){
    courses += `<line x1="${left}" y1="${y}" x2="${left+w}" y2="${y}" stroke="rgba(255,255,255,.38)" stroke-width="1.5"/>`;
  }
  const clipId = 'fndClip' + Math.round(p);
  return `
  <svg viewBox="0 0 150 200" width="100%" height="auto" role="img" aria-label="Progresso da fundação: ${p}%">
    <rect x="${left}" y="${top}" width="${w}" height="${h}" rx="3" fill="none" style="stroke:var(--ink-20)" stroke-width="1.5"/>
    <clipPath id="${clipId}">
      <rect x="${left}" y="${fillY}" width="${w}" height="${fillH}" rx="2"/>
    </clipPath>
    <g clip-path="url(#${clipId})">
      <rect x="${left}" y="${top}" width="${w}" height="${h}" style="fill:var(--pillar)"/>
      ${courses}
    </g>
    <line x1="${left-6}" y1="${top}" x2="${left-6}" y2="${top+h}" style="stroke:var(--ink-20)" stroke-width="1"/>
    ${ticks}
  </svg>`;
}

function miniBarHTML(percent, over){
  const p = Math.max(0, Math.min(100, percent));
  return `<div class="bar-track"><div class="bar-fill" style="width:${p}%; ${over?'background-color:var(--danger);':'background-color:var(--pillar);'}"></div></div>`;
}

/* ================= RENDER: CALENDÁRIO ================= */
function contrastText(hex){
  const c = (hex||'#83A6CC').replace('#','');
  const r = parseInt(c.substr(0,2),16)||0, g = parseInt(c.substr(2,2),16)||0, b = parseInt(c.substr(4,2),16)||0;
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.62 ? '#2A2F28' : '#FFFFFF';
}

function chipHTML(e, iso){
  if(e.kind==='transacao'){
    return `<div class="cal-chip tx">
      <span class="dot" style="background:${e.color}"></span>
      <span class="chip-label">${e.label}</span>
      <span class="chip-amt num">${e.txType==='receita'?'+':'-'}${brl(e.amount)}</span>
    </div>`;
  }
  const isTask = e.kind==='tarefa';
  const ctxAttrs = `data-ctx-id="${e.id}" data-ctx-iso="${iso}"`;
  if(isTask){
    return `<div class="cal-chip task ${e.done?'done':''}" data-toggle-task="${e.id}" data-toggle-date="${iso}" ${ctxAttrs}>
      <span class="task-check ${e.done?'done':''}"></span>
      <span class="chip-label">${e.time?`<span class="chip-time num">${e.time}</span> `:''}${e.label}</span>
    </div>`;
  }
  const txt = contrastText(e.color);
  return `<div class="cal-chip event" style="background:${e.color}; color:${txt};" ${ctxAttrs}>
    <span class="chip-label">${e.time?`<span class="chip-time num" style="color:${txt}; opacity:.85;">${e.time}</span> `:''}${e.label}</span>
  </div>`;
}

function renderCalendarioMensal(){
  const ref = parseDate(calRefDate);
  const year = ref.getFullYear(), month = ref.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonthCount = new Date(year, month+1, 0).getDate();
  const totalWeeks = Math.ceil((startOffset+daysInMonthCount)/7);
  const startDate = addDays(first, -startOffset);
  let cells = '';
  for(let i=0;i<totalWeeks*7;i++){
    const d = addDays(startDate, i);
    const iso = toISO(d);
    const inMonth = d.getMonth()===month;
    const entries = dayEntries(iso);
    const shown = entries.slice(0,2);
    const overflow = entries.length-2;
    cells += `
      <div class="cal-cell ${inMonth?'':'out'} ${iso===TODAY_ISO?'today':''}" data-date="${iso}">
        <div class="cal-cell-head">
          <span class="cal-daynum">${d.getDate()}</span>
          <button class="cal-add" data-quickadd="${iso}" title="Adicionar à agenda" type="button">+</button>
        </div>
        <div class="cal-cell-items">
          ${shown.map(e=>chipHTML(e, iso)).join('')}
          ${overflow>0?`<div class="cal-more">+${overflow} mais</div>`:''}
        </div>
      </div>`;
  }
  return `
    <div class="cal-weekdays">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  `;
}

function renderCalendarioSemanal(){
  const ref = parseDate(calRefDate);
  const start = startOfWeek(ref);
  let cols = '';
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const iso = toISO(d);
    const entries = dayEntries(iso);
    cols += `
      <div class="cal-week-col ${iso===TODAY_ISO?'today':''}" data-date="${iso}">
        <div class="cal-week-head">
          <div class="wd">${WEEKDAYS[i]}</div>
          <div class="dn">${d.getDate()}</div>
        </div>
        <div class="cal-week-items">
          ${entries.length ? entries.map(e=>chipHTML(e, iso)).join('') : `<div class="cal-empty">—</div>`}
        </div>
        <button class="btn btn-ghost btn-sm cal-week-add" data-quickadd="${iso}" type="button">${icon('plus')} agenda</button>
      </div>`;
  }
  return `<div class="cal-week-grid">${cols}</div>`;
}

function renderCalendario(){
  const ref = parseDate(calRefDate);
  let navLabel;
  if(calMode==='mensal') navLabel = ref.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  else if(calMode==='semanal'){
    const start = startOfWeek(ref), end = addDays(start,6);
    navLabel = `${start.getDate()} – ${end.getDate()} de ${end.toLocaleDateString('pt-BR',{month:'long'})}`;
  } else {
    navLabel = ref.toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'});
  }
  const body = calMode==='mensal' ? renderCalendarioMensal() : calMode==='semanal' ? renderCalendarioSemanal() : renderCalendarioDiario();
  return `
    <div class="card animate-in">
      <div class="cal-toolbar">
        <div class="seg-toggle">
          <button class="${calMode==='mensal'?'active':''}" data-calmode="mensal" type="button">Mensal</button>
          <button class="${calMode==='semanal'?'active':''}" data-calmode="semanal" type="button">Semanal</button>

          <button class="btn btn-ghost btn-sm" data-calnav="prev" type="button">${icon('chevronLeft')}</button>

      ${body}

}

function attachCalendarioEvents(){
  document.querySelectorAll('[data-calmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ calMode = btn.dataset.calmode; renderView(); });
  });
  function step(dir){
    const d = parseDate(calRefDate);
    if(calMode==='mensal') d.setMonth(d.getMonth()+dir);
    else if(calMode==='semanal') d.setDate(d.getDate()+7*dir);
    else d.setDate(d.getDate()+dir);
    calRefDate = toISO(d);
    renderView();
  }
  const prevBtn = document.querySelector('[data-calnav="prev"]');
  const nextBtn = document.querySelector('[data-calnav="next"]');
  const todayBtn = document.querySelector('[data-calnav="today"]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>step(-1));
  if(nextBtn) nextBtn.addEventListener('click', ()=>step(1));
  if(todayBtn) todayBtn.addEventListener('click', ()=>{ calRefDate=TODAY_ISO; renderView(); });

  const calPdfBtn = document.getElementById('exportCalPdfBtn');
  const pdfBtn = document.getElementById('exportPdfBtn');
  if(calPdfBtn) calPdfBtn.addEventListener('click', ()=> generateCalendarPDF(calMode));
  if(pdfBtn) pdfBtn.addEventListener('click', ()=>{
    const d = parseDate(calRefDate);
    generateMonthlyReportPDF(d.getFullYear(), d.getMonth());
  });

  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('click', (e)=>{
      if(e.target.closest('[data-quickadd]') || e.target.closest('[data-toggle-task]')) return;
      calRefDate = cell.dataset.date; calMode='diario'; renderView();
    });
  });
  document.querySelectorAll('[data-quickadd]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openEventModal(btn.dataset.quickadd); });
  });
  document.querySelectorAll('[data-newtx]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openTxModal(btn.dataset.newtx); });
  });
  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleTaskDone(el.dataset.toggleTask, el.dataset.toggleDate); });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showConfirm('Excluir esta transação?', ()=>{
        state.transactions = state.transactions.filter(t=>t.id!==btn.dataset.del);
        saveState(); renderAll();
      });
    });
  });
  document.querySelectorAll('[data-delevent]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showConfirm('Excluir este item da agenda? Se ele se repete, todas as ocorrências serão removidas.', ()=>{
        state.events = state.events.filter(ev=>ev.id!==btn.dataset.delevent);
        saveState(); renderAll();
      });
    });
  });
}

function downscaleImage(file, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){ const scale = maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function attachNotasEvents(){
  document.querySelectorAll('[data-note]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.note-select')) return;
      currentNoteId = el.dataset.note; renderView();
    });
  });
  document.querySelectorAll('[data-noteselect]').forEach(cb=>{
    cb.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = cb.dataset.noteselect;
      if(cb.checked) selectedNoteIds.add(id); else selectedNoteIds.delete(id);
      renderView();
    });
  });
  const exportBtn = document.getElementById('exportSelectedBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportSelectedNotes);
  const nb = document.getElementById('newNoteBtn');
  if(nb) nb.addEventListener('click', ()=>{
    const n = {id:uid(), title:'Nova nota', content:'', attachments:[], updatedAt:new Date().toISOString()};
    state.notes.unshift(n);
    currentNoteId = n.id;
    saveState(); renderAll();
    setTimeout(()=>{ const t=document.getElementById('noteTitleInput'); if(t){ t.focus(); t.select(); } }, 30);
  });
  const titleInp = document.getElementById('noteTitleInput');
  const contentInp = document.getElementById('noteContentInput');
  let saveTimer = null;
  function scheduleSave(){
    const targetId = currentNoteId;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      const note = state.notes.find(n=>n.id===targetId);
      if(!note) return;
      note.title = titleInp.value || 'Sem título';
      note.content = contentInp.value;
      note.updatedAt = new Date().toISOString();
      saveState();
    }, 450);
  }
  if(titleInp) titleInp.addEventListener('input', scheduleSave);
  if(contentInp) contentInp.addEventListener('input', scheduleSave);
  const delBtn = document.getElementById('delNoteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    showConfirm('Excluir esta nota?', ()=>{
      state.notes = state.notes.filter(n=>n.id!==currentNoteId);
      selectedNoteIds.delete(currentNoteId);
      currentNoteId = state.notes.length ? state.notes[0].id : null;
      saveState(); renderAll();
    });
  });
  const attachBtn = document.getElementById('attachBtn');
  const attachInput = document.getElementById('attachInput');
  if(attachBtn) attachBtn.addEventListener('click', ()=> attachInput.click());
  if(attachInput) attachInput.addEventListener('change', ()=>{
    const file = attachInput.files[0];
    if(!file) return;
    const note = state.notes.find(n=>n.id===currentNoteId);
    if(!note) return;
    note.attachments = note.attachments || [];
    const finish = (dataUrl)=>{
      note.attachments.push({ id:uid(), name:file.name, kind:file.type.startsWith('image/')?'image':'file', dataUrl });
      note.updatedAt = new Date().toISOString();
      saveState();
      renderAll();
    };
    if(file.type.startsWith('image/')){
      downscaleImage(file, finish);
    } else {
      if(file.size > 1500000){ showToast('Este arquivo é grande demais para anexar (limite aproximado de 1.5MB).', 'error'); return; }
      const reader = new FileReader();
      reader.onload = (e)=> finish(e.target.result);
      reader.readAsDataURL(file);
    }
  });
  document.querySelectorAll('[data-removeatt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const note = state.notes.find(n=>n.id===currentNoteId);
      if(!note) return;
      note.attachments = (note.attachments||[]).filter(a=>a.id!==btn.dataset.removeatt);
      saveState(); renderAll();
    });
  });
}

function exportSelectedNotes(){
  const notes = state.notes.filter(n=>selectedNoteIds.has(n.id));
  if(!notes.length) return;
  if(typeof window.jspdf === 'undefined'){ showToast('Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.', 'error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 18, pageW = 210, pageH = 297, marginBottom = 20;
  notes.forEach((n, idx)=>{
    if(idx>0) doc.addPage();
    let y = 24;
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(30,40,36);
    doc.text(n.title || 'Sem título', marginX, y);
    y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(150,150,150);
    doc.text('Editado em '+new Date(n.updatedAt).toLocaleDateString('pt-BR'), marginX, y);
    y += 7;
    doc.setDrawColor(225); doc.line(marginX, y, pageW-marginX, y);
    y += 9;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(40,48,44);
    const lines = doc.splitTextToSize(n.content || '(sem conteúdo)', pageW - marginX*2);
    lines.forEach(line=>{
      if(y > pageH - marginBottom){ doc.addPage(); y = 24; }
      doc.text(line, marginX, y);
      y += 5.6;
    });
    const attachments = n.attachments || [];
    const images = attachments.filter(a=>a.kind==='image');
    const files = attachments.filter(a=>a.kind!=='image');
    if(images.length){
      y += 4;
      images.forEach(att=>{
        if(y > pageH - 78){ doc.addPage(); y = 24; }
        try{ doc.addImage(att.dataUrl, 'JPEG', marginX, y, 70, 52); }catch(e){}
        y += 58;
      });
    }
    if(files.length){
      if(y > pageH - marginBottom - 10){ doc.addPage(); y = 24; }
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(120,128,122);
      files.forEach(att=>{
        doc.text('📎 Anexo: '+att.name, marginX, y);
        y += 5.4;
      });
    }
  });
  openPDF(doc, notes.length===1 ? `${(notes[0].title||'nota').replace(/[^\w\-]+/g,'_')}.pdf` : 'alicerce-notas.pdf');
}

      <button class="btn btn-ghost btn-sm" id="repPdfBtn" type="button">${icon('chart')} Exportar relatório (PDF)</button>

        </div>

                  <td class="num" style="text-align:right;">${brl(spent)}</td>

          <div class="section-sub">Participação de cada categoria no total de gastos</div>
          <div class="chart-box"><canvas id="repDonut"></canvas></div>
          <div class="legend-list">
            ${cats.map(c=>{

              return `<div class="legend-row">
                <span class="dot" style="background:${CATEGORY_HEX[c]}"></span>

function mountRelatoriosCharts(){
  const repPdfBtn = document.getElementById('repPdfBtn');
  if(repPdfBtn) repPdfBtn.addEventListener('click', ()=>{
    const d = parseDate(TODAY_ISO);
    generateMonthlyReportPDF(d.getFullYear(), d.getMonth());
  });
  if(typeof Chart === 'undefined') return;
  const pal = THEME_PALETTES[currentTheme] || THEME_PALETTES.pastel;
  const history = [...state.history, {month:'Jul', receita:totalReceita(), despesa:totalDespesa()}];
  const barsCtx = document.getElementById('repBars');
  if(barsCtx){
    if(charts.repBars) charts.repBars.destroy();
    charts.repBars = new Chart(barsCtx, {
      type:'bar',
      data:{
        labels:history.map(h=>h.month),
        datasets:[
          { label:'Receita', data:history.map(h=>h.receita), backgroundColor:pal.pillar, borderRadius:4, maxBarThickness:22 },
          { label:'Despesa', data:history.map(h=>h.despesa), backgroundColor:pal.clay, borderRadius:4, maxBarThickness:22 }
        ]

      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'IBM Plex Sans' }, boxWidth:10, usePointStyle:true } } },
        scales:{
          y:{ grid:{ color:'rgba(22,32,28,.08)' }, ticks:{ font:{ family:'IBM Plex Mono', size:10 } } },
          x:{ grid:{ display:false }, ticks:{ font:{ family:'IBM Plex Sans', size:11 } } }

    if(charts.repCatBars) charts.repCatBars.destroy();
    charts.repCatBars = new Chart(catBarsCtx, {

      options:{
        indexAxis:'y',
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(c)=> brl(c.raw) } } },
        scales:{
          x:{ grid:{ color:'rgba(22,32,28,.08)' }, ticks:{ font:{ family:'IBM Plex Mono', size:9.5 } } },
          y:{ grid:{ display:false }, ticks:{ font:{ family:'IBM Plex Sans', size:11 } } }
        }
      }
    });
  }
}

/* ================= MODALS ================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" style="max-width:360px;">
        <h3 style="font-size:16px;">${opts.title || 'Confirmar ação'}</h3>
        <p style="font-size:13.5px; color:var(--ink-70); line-height:1.55; margin:0 0 4px;">${message}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="confirmCancel" type="button">Cancelar</button>
          <button class="btn btn-primary" id="confirmOk" type="button" style="${opts.danger!==false?'background:var(--danger);':''}">${opts.okLabel || 'Excluir'}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backdrop').addEventListener('click', (e)=>{ if(e.target.id==='backdrop') closeModal(); });
  document.getElementById('confirmCancel').addEventListener('click', closeModal);
  document.getElementById('confirmOk').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
  setTimeout(()=>document.getElementById('confirmOk').focus(), 30);
}

function showToast(message, kind){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='error' ? ' error' : '');
  t.textContent = message;
  root.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=> t.remove(), 300);
  }, 3400);
}

    sel.innerHTML = list.map(c=>`<option value="${c}">${c}</option>`).join('');

/* ================= CONTEXT MENU (right-click on events/tasks) ================= */
function closeContextMenu(){
  const el = document.getElementById('contextMenuRoot');
  if(el) el.remove();
}
function showContextMenu(x, y, evId, iso){
  closeContextMenu();
  const ev = state.events.find(e=>e.id===evId);
  if(!ev) return;
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'contextMenuRoot';
  menu.innerHTML = `
    <button type="button" data-ctxaction="details">${icon('grid')} Ver detalhes</button>
    <button type="button" data-ctxaction="edit">${icon('columns')} Editar</button>
    <hr>
    <button type="button" class="danger" data-ctxaction="delete">${icon('trash')} Excluir</button>
  `;
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  let left = x, top = y;
  if(left + r.width > window.innerWidth) left = window.innerWidth - r.width - 8;
  if(top + r.height > window.innerHeight) top = window.innerHeight - r.height - 8;
  menu.style.left = left+'px';
  menu.style.top = top+'px';
  menu.querySelector('[data-ctxaction="details"]').addEventListener('click', ()=>{ closeContextMenu(); openEventDetailsModal(evId, iso); });
  menu.querySelector('[data-ctxaction="edit"]').addEventListener('click', ()=>{ closeContextMenu(); openEventModal(ev.date, ev.id); });
  menu.querySelector('[data-ctxaction="delete"]').addEventListener('click', ()=>{
    closeContextMenu();
    showConfirm('Excluir este item da agenda? Se ele se repete, todas as ocorrências serão removidas.', ()=>{
      state.events = state.events.filter(e=>e.id!==evId);
      saveState(); renderAll();
    });
  });
}

      saveState(); renderAll();

  });
}

const QUICK_COLORS = ['#83A6CC','#B686A3','#CCA35C','#CE7B6C','#5C8770','#C9C0B2','#D9906F','#ACAFD1'];

function openEventModal(prefillDate, editId){
  const root = document.getElementById('modalRoot');
  const editing = editId ? state.events.find(e=>e.id===editId) : null;
  let kind = editing ? editing.type : 'evento';
  let chosenColor = editing ? (editing.color || AGENDA_COLORS[editing.category]) : AGENDA_COLORS['Trabalho'];
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal">
        <h3>${editing?'Editar item da agenda':'Novo item na agenda'}</h3>
        <div class="type-toggle" style="margin-bottom:16px;">
          <button type="button" class="${kind==='evento'?'active':''}" data-kind="evento">Evento</button>
          <button type="button" class="${kind==='tarefa'?'active':''}" data-kind="tarefa">Tarefa</button>
        </div>
        <div class="field"><label>Título</label><input type="text" id="evTitle" placeholder="Ex.: Reunião de obra" value="${editing?editing.title.replace(/"/g,'&quot;'):''}"></div>
        <div class="field" style="display:flex; gap:10px;">
          <div style="flex:1;"><label>Data</label><input type="date" id="evDate" value="${editing?editing.date:(prefillDate||TODAY_ISO)}"></div>
          <div style="flex:1;"><label>Hora (opcional)</label><input type="time" id="evTime" value="${editing&&editing.time?editing.time:''}"></div>
        </div>
        <div class="field"><label>Categoria</label><select id="evCat">${AGENDA_CATEGORIES.map(c=>`<option value="${c}" ${editing&&editing.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field">
          <label>Cor</label>
          <div class="color-row">
            ${QUICK_COLORS.map(c=>`<button type="button" class="color-swatch ${chosenColor.toLowerCase()===c.toLowerCase()?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('')}
            <input type="color" id="evColorCustom" value="${chosenColor}" title="Cor personalizada">
          </div>
        </div>
        <div class="field"><label>Repetir</label>
          <select id="evRec">
            <option value="nenhuma" ${editing&&editing.recurrence==='nenhuma'?'selected':''}>Não se repete</option>
            <option value="diaria" ${editing&&editing.recurrence==='diaria'?'selected':''}>Todos os dias</option>
            <option value="semanal" ${editing&&editing.recurrence==='semanal'?'selected':''}>Toda semana</option>
            <option value="mensal" ${editing&&editing.recurrence==='mensal'?'selected':''}>Todo mês</option>
            <option value="anual" ${editing&&editing.recurrence==='anual'?'selected':''}>Todo ano</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelEv" type="button">Cancelar</button>
          <button class="btn btn-primary" id="saveEv" type="button">${editing?'Salvar alterações':'Salvar'}</button>
        </div>
      </div>
    </div>
  `;
  root.querySelectorAll('[data-kind]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      kind = btn.dataset.kind;
      root.querySelectorAll('[data-kind]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  function selectColor(c){
    chosenColor = c;
    root.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('active', s.dataset.color.toLowerCase()===c.toLowerCase()));
    document.getElementById('evColorCustom').value = c;
  }
  root.querySelectorAll('.color-swatch').forEach(sw=>{
    sw.addEventListener('click', ()=> selectColor(sw.dataset.color));
  });
  document.getElementById('evColorCustom').addEventListener('input', (e)=> selectColor(e.target.value));
  document.getElementById('backdrop').addEventListener('click', (e)=>{ if(e.target.id==='backdrop') closeModal(); });
  document.getElementById('cancelEv').addEventListener('click', closeModal);
  document.getElementById('saveEv').addEventListener('click', ()=>{
    const title = document.getElementById('evTitle').value.trim();
    const date = document.getElementById('evDate').value || TODAY_ISO;
    const time = document.getElementById('evTime').value || null;
    const category = document.getElementById('evCat').value;
    const recurrence = document.getElementById('evRec').value;
    if(!title){ showToast('Dê um título para o item.', 'error'); return; }
    if(editing){
      Object.assign(editing, { title, date, time, category, recurrence, type:kind, color:chosenColor });
    } else {
      state.events.push({ id:uid(), title, date, time, category, recurrence, type:kind, color:chosenColor, done:false, doneDates:[] });
    }
    saveState();
    closeModal();
    renderAll();
  });
  setTimeout(()=>document.getElementById('evTitle').focus(), 30);
}

/* ================= MASTER RENDER ================= */
function renderView(){
  const root = document.getElementById('viewRoot');
  if(currentView==='dashboard'){ root.innerHTML = renderDashboard(); mountDashboardCharts(); }
  else if(currentView==='calendario'){ root.innerHTML = renderCalendario(); attachCalendarioEvents(); }
  else if(currentView==='notas'){ root.innerHTML = renderNotas(); attachNotasEvents(); }
  else if(currentView==='transacoes'){ root.innerHTML = renderTransacoes(); attachTransacoesEvents(); }
  else if(currentView==='orcamento'){ root.innerHTML = renderOrcamento(); attachOrcamentoEvents(); }
  else if(currentView==='metas'){ root.innerHTML = renderMetas(); attachMetasEvents(); }
  else if(currentView==='relatorios'){ root.innerHTML = renderRelatorios(); mountRelatoriosCharts(); }
}

function renderAll(){
  renderSidebar();
  renderView();
}

/* ================= AI ASSISTANT ================= */
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildFinanceContext(){
  const receita = totalReceita(), despesa = totalDespesa(), saldo = receita-despesa;
  const budgetLines = EXPENSE_CATEGORIES.map(c=>{
    const spent = spentByCategory(c), planned = state.budgets[c]||0;
    return `${c}: gasto ${brl(spent)} de um planejado de ${brl(planned)}`;
  }).join('; ');
  const goalsLines = state.goals.map(g=>`${g.name}: ${brl(g.saved)} de ${brl(g.target)} (${Math.round(g.saved/g.target*100)}%)`).join('; ');
  const todayAgenda = agendaOnDate(TODAY_ISO).map(ev=>`${ev.type==='tarefa'?'Tarefa':'Evento'} "${ev.title}"${ev.time?' às '+ev.time:''}`).join('; ') || 'nada agendado';
  return `Mês de referência: ${MONTH_LABEL}. Receita do mês: ${brl(receita)}. Despesas do mês: ${brl(despesa)}. Saldo: ${brl(saldo)}.\nOrçamento por categoria — ${budgetLines}.\nMetas — ${goalsLines}.\nAgenda de hoje (${TODAY_ISO}) — ${todayAgenda}.`;
}

function toggleAIPanel(){
  aiPanelOpen = !aiPanelOpen;
  renderAIPanel();
}

function renderAIPanel(){
  const root = document.getElementById('aiPanelRoot');
  if(!aiPanelOpen){ root.innerHTML=''; return; }
  root.innerHTML = `
    <div class="ai-panel">
      <div class="ai-panel-head">
        <div><strong>Assistente Alicerce</strong><div class="sub">pergunte sobre suas finanças e agenda</div></div>
        <button class="ai-close" id="aiCloseBtn" type="button">${icon('close')}</button>
      </div>
      <div class="ai-messages" id="aiMessages">
        ${aiChatHistory.length ? aiChatHistory.map(m=>`<div class="ai-msg ${m.role}${m.typing?' typing':''}">${escapeHtml(m.text)}</div>`).join('') : `<div class="ai-empty">Pergunte, por exemplo: "quanto ainda posso gastar em lazer este mês?" ou "o que tenho agendado hoje?"</div>`}
      </div>
      <div class="ai-input-row">
        <input type="text" id="aiInput" placeholder="Escreva sua pergunta…">
        <button class="ai-send" id="aiSendBtn" type="button">${icon('chevronRight')}</button>
      </div>
    </div>
  `;
  document.getElementById('aiCloseBtn').addEventListener('click', toggleAIPanel);
  const input = document.getElementById('aiInput');
  const send = ()=>{
    const q = input.value.trim();
    if(!q) return;
    input.value='';
    submitAIQuestion(q);
  };
  document.getElementById('aiSendBtn').addEventListener('click', send);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
  const msgsEl = document.getElementById('aiMessages');
  msgsEl.scrollTop = msgsEl.scrollHeight;
  setTimeout(()=>input.focus(), 20);
}

async function submitAIQuestion(q){
  aiChatHistory.push({ role:'user', text:q });
  renderAIPanel();
  aiChatHistory.push({ role:'assistant', text:'digitando…', typing:true });
  renderAIPanel();
  try{
    const context = buildFinanceContext();
    const history = aiChatHistory.filter(m=>!m.typing).map(m=>({ role:m.role, content:m.text }));
    const apiMessages = history.slice(0,-1).concat([{ role:'user', content:`Contexto financeiro e de agenda do usuário:\n${context}\n\nPergunta do usuário: ${q}` }]);
    let response;
    try{
      response = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1000,
          system:'Você é o assistente financeiro do app Alicerce. Responda em português do Brasil, de forma curta, objetiva e prática, usando somente os dados de contexto fornecidos pelo usuário. Se não souber algo com base nesse contexto, diga isso claramente e não invente valores.',
          messages: apiMessages
        })
      });
    }catch(networkErr){
      throw new Error('NETWORK');
    }
    let data = null;
    try{ data = await response.json(); }catch(parseErr){ /* leave data null */ }
    if(!response.ok){
      const apiMsg = data && data.error && data.error.message ? data.error.message : ('HTTP '+response.status);
      throw new Error(apiMsg);
    }
    const text = (data && data.content ? data.content : []).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim() || 'Não consegui gerar uma resposta agora.';
    aiChatHistory.pop();
    aiChatHistory.push({ role:'assistant', text });
  }catch(err){
    aiChatHistory.pop();
    const reason = err && err.message==='NETWORK'
      ? 'não consegui conectar à API — isso costuma acontecer quando o arquivo é aberto fora do Claude.ai (por exemplo, salvo e aberto direto no navegador). O assistente só funciona quando este site é visualizado dentro do artefato do Claude.'
      : `houve um erro na resposta (${err && err.message ? err.message : 'desconhecido'})`;
    aiChatHistory.push({ role:'assistant', text:'Não consegui responder agora: '+reason });
  }
  renderAIPanel();
}

/* ================= INIT ================= */
async function init(){
  state = await loadState();
  applyTheme(state.theme || 'pastel');
  document.getElementById('newTxBtn').addEventListener('click', ()=>openTxModal());
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    showConfirm('Isso vai apagar seus dados atuais e restaurar o exemplo. Continuar?', ()=>{
      state = seedState();
      saveState();
      currentView = 'dashboard';
      applyTheme('pastel');
    }, {title:'Restaurar dados de exemplo', okLabel:'Restaurar', danger:true});
  });
  document.querySelectorAll('.theme-dot').forEach(btn=>{
    btn.addEventListener('click', ()=> applyTheme(btn.dataset.themeBtn));
  });
  document.addEventListener('contextmenu', (e)=>{
    const chip = e.target.closest('[data-ctx-id]');
    if(chip){
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, chip.dataset.ctxId, chip.dataset.ctxIso);
    }
  });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeModal(); closeContextMenu(); } });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.context-menu')) closeContextMenu(); });
  document.getElementById('aiFab').addEventListener('click', toggleAIPanel);
}

init();
</script>
